name: Release

# Automated semantic-version releases. On every push to main, release-please
# maintains a "release PR" that bumps the version and CHANGELOG from Conventional
# Commits. Merging that PR creates the vX.Y.Z tag + GitHub Release; this same run
# then builds and attaches the cross-platform binaries with GoReleaser.
#
# Doing both in one workflow (rather than triggering GoReleaser from the tag push)
# sidesteps the GitHub rule that a GITHUB_TOKEN-pushed tag does not trigger other
# workflows.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          release-type: go

  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
